<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Eurex Options Terminal</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2216%22 fill=%22%230a0e14%22/><path d=%22M15 70 L35 45 L50 58 L85 20%22 stroke=%22%2334d399%22 stroke-width=%229%22 fill=%22none%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3"></script>
<script src="https://cdn.jsdelivr.net/npm/hammerjs@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2"></script>
<script src="data.js"></script>
<style>
  :root {
    color-scheme: dark;
    --bg: #0a0e14;
    --bg-raised: #10151d;
    --border: #232b38;
    --border-soft: #1a212c;
    --text: #e6edf3;
    --text-dim: #7b8794;
    --accent: #22d3ee;
    --call: #3b82f6;
    --put: #f59e0b;
    --maxpain: #a78bfa;
    --mono: "Roboto Mono", "SF Mono", "Cascadia Code", Consolas, monospace;
    --sans: -apple-system, "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { background: var(--bg); }
  body {
    font-family: var(--sans); color: var(--text); margin: 0 auto; padding: 28px 40px; max-width: 1920px; font-size: 13px;
    background:
      radial-gradient(900px 480px at 12% -8%, rgba(34,211,238,0.06), transparent 60%),
      radial-gradient(800px 420px at 100% 0%, rgba(59,130,246,0.05), transparent 60%),
      var(--bg);
    background-attachment: fixed;
  }
  h1 { font-family: var(--mono); font-size: 15px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; margin: 0 0 20px; color: var(--text); }
  h1 .dim { color: var(--text-dim); font-weight: 400; }

  .tabs { display: inline-flex; gap: 3px; margin-bottom: 18px; padding: 4px; background: var(--bg-raised); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 6px 24px -12px rgba(0,0,0,0.7); }
  .tabs button {
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.05em; text-transform: uppercase;
    padding: 8px 16px; border: none; border-radius: 9px; background: none; color: var(--text-dim); cursor: pointer;
    transition: background 0.25s ease, color 0.25s ease, box-shadow 0.25s ease, transform 0.15s ease;
  }
  .tabs button:hover { color: var(--text); transform: translateY(-1px); }
  .tabs button.active { color: #0a0e14; background: var(--accent); box-shadow: 0 4px 20px -4px rgba(240,180,41,0.55); }

  .view { display: none; }
  .view.active { display: block; animation: fadeSlideIn 0.35s ease; }
  @keyframes fadeSlideIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .controls { display: flex; gap: 14px; align-items: center; margin-bottom: 18px; flex-wrap: wrap; }
  .controls label { font-size: 11px; color: var(--text-dim); display: flex; align-items: center; gap: 8px; }
  select, button {
    font-family: var(--mono); font-size: 12px; padding: 7px 12px; background: var(--bg-raised); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px; transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.15s ease;
  }
  button { cursor: pointer; }
  button:hover, select:hover { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), 0 6px 20px -8px rgba(240,180,41,0.4); }
  button:active { transform: translateY(1px); }
  .hint { font-size: 11px; color: var(--text-dim); }

  .summary { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 22px; }
  .summary div {
    min-width: 112px; padding: 12px 18px; background: var(--bg-raised); border: 1px solid var(--border); border-radius: 12px;
    box-shadow: 0 8px 24px -14px rgba(0,0,0,0.8); transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
  }
  .summary div:hover { transform: translateY(-2px); border-color: #2e3847; box-shadow: 0 12px 32px -12px rgba(0,0,0,0.85); }
  .summary .label { font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
  .summary .value { font-family: var(--mono); font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }

  .chart-card {
    background: var(--bg-raised); border: 1px solid var(--border); border-radius: 14px; padding: 18px 20px 8px;
    margin-bottom: 20px; box-shadow: 0 10px 34px -16px rgba(0,0,0,0.8);
  }
  canvas { max-height: 420px; }
  .empty { color: var(--text-dim); padding: 40px; text-align: center; font-family: var(--mono); font-size: 12px; }

  table.heatmap { border-collapse: collapse; font-family: var(--mono); font-size: 12.5px; font-variant-numeric: tabular-nums; letter-spacing: 0.01em; white-space: nowrap; }
  table.heatmap th, table.heatmap td { padding: 4px 9px; text-align: right; border: 1px solid var(--border-soft); }
  table.heatmap td { font-weight: 500; color: var(--text); }
  table.heatmap th { position: sticky; top: 0; background: var(--bg-raised); color: var(--text-dim); font-weight: 600; text-transform: uppercase; font-size: 12px; letter-spacing: 0.04em; }
  table.heatmap thead tr:first-child th { top: 0; }
  table.heatmap thead tr:last-child th { top: 31px; opacity: 0.9; }
  table.heatmap td.strike-col, table.heatmap th.strike-col { position: sticky; left: 0; background: var(--bg-raised); text-align: left; font-weight: 600; color: var(--text); z-index: 1; }
  table.heatmap .wrap { max-height: 640px; overflow: auto; background: var(--bg-raised); border: 1px solid var(--border); border-radius: 14px; box-shadow: 0 10px 34px -16px rgba(0,0,0,0.8); }
  table.heatmap td.call-cell { border-right: none; }
  table.heatmap td.put-cell { border-left: none; }
  table.heatmap th.date-col { border-bottom: none; }
  .atm-row td.strike-col { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: 3px; }

  .pc-stats-header { display: flex; align-items: center; gap: 24px; flex-wrap: wrap; padding-bottom: 14px; margin-bottom: 14px; border-bottom: 1px solid var(--border-soft); }
  .pc-stat { display: flex; align-items: baseline; gap: 8px; }
  .pc-stat-label { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.05em; }
  .pc-stat-value { font-family: var(--mono); font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .pc-stat-value.current { color: #f87171; }
  .pc-metric-toggle { margin-left: auto; font-size: 11px; color: var(--text-dim); display: flex; align-items: center; gap: 8px; }
  .pc-title { font-family: var(--mono); font-size: 11px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 10px; }
</style>
</head>
<body>
  <h1>Eurex Options Terminal <span class="dim">/ ODAX · OESX · ODAP · OEXP</span></h1>

  <div class="tabs">
    <button id="tabOiVolBtn" class="active">OI + Volume by Strike</button>
    <button id="tabMatrixBtn">OI Matrix</button>
    <button id="tabChangeMatrixBtn">OI Change Matrix</button>
    <button id="tabPcRatioBtn">P/C Ratio</button>
  </div>

  <div class="controls">
    <label>Product <select id="product"></select></label>
    <label id="expiryLabel">Expiry <select id="expiry"></select></label>
  </div>

  <div id="tabOiVol" class="view active">
    <div class="summary" id="summary"></div>
    <div class="controls">
      <button id="resetZoomBtn" type="button">Reset zoom</button>
      <span class="hint">Mouse wheel — zoom by strike, drag — pan</span>
    </div>
    <div class="chart-card"><canvas id="oiChart"></canvas></div>
    <div class="chart-card"><canvas id="volChart"></canvas></div>
  </div>

  <div id="tabMatrix" class="view">
    <div id="matrixContainer"></div>
  </div>

  <div id="tabChangeMatrix" class="view">
    <div id="changeMatrixContainer"></div>
  </div>

  <div id="tabPcRatio" class="view">
    <div class="chart-card">
      <div class="pc-stats-header">
        <div class="pc-stat"><span class="pc-stat-label">Current</span><span class="pc-stat-value current" id="pcCurrentVal">—</span></div>
        <div class="pc-stat"><span class="pc-stat-label">Average for period</span><span class="pc-stat-value" id="pcAvgVal">—</span></div>
        <label class="pc-metric-toggle">Metric <select id="pcMetric"><option value="oi">Open Interest</option><option value="vol">Volume</option></select></label>
      </div>
      <div class="pc-title" id="pcHistoryTitle">Put/Call Ratio by Day</div>
      <canvas id="pcHistoryChart"></canvas>
    </div>
    <div class="chart-card"><canvas id="pcTermChart"></canvas></div>
  </div>

  <div id="empty" class="empty" style="display:none">No data. Run connector/save_snapshot.py.</div>

<script>
const productSelect = document.getElementById("product");
const expirySelect = document.getElementById("expiry");
const summaryEl = document.getElementById("summary");
const emptyEl = document.getElementById("empty");
const matrixContainer = document.getElementById("matrixContainer");
const changeMatrixContainer = document.getElementById("changeMatrixContainer");
const pcMetricSelect = document.getElementById("pcMetric");
let oiChart, volChart, pcHistoryChart, pcTermChart, activeTab = "oiVol";

function fmt(n) { return n.toLocaleString("ru-RU"); }
function daysBetween(a, b) { return Math.round((new Date(b) - new Date(a)) / 86400000); }

function latestSession(product) { return product.sessions[product.sessions.length - 1]; }

function switchTab(tab) {
  activeTab = tab;
  document.getElementById("tabOiVol").classList.toggle("active", tab === "oiVol");
  document.getElementById("tabMatrix").classList.toggle("active", tab === "matrix");
  document.getElementById("tabChangeMatrix").classList.toggle("active", tab === "changeMatrix");
  document.getElementById("tabPcRatio").classList.toggle("active", tab === "pcRatio");
  document.getElementById("tabOiVolBtn").classList.toggle("active", tab === "oiVol");
  document.getElementById("tabMatrixBtn").classList.toggle("active", tab === "matrix");
  document.getElementById("tabChangeMatrixBtn").classList.toggle("active", tab === "changeMatrix");
  document.getElementById("tabPcRatioBtn").classList.toggle("active", tab === "pcRatio");
  render();
}

const DAILY_PRODUCTS = new Set(["ODAP", "OEXP"]);
const PRODUCT_LABELS = {
  ODAX: "ODAX — DAX options (weekly/monthly)",
  OESX: "OESX — EURO STOXX 50 options (weekly/monthly)",
  ODAP: "ODAP — DAX Daily Options (daily expiry)",
  OEXP: "OEXP — EURO STOXX 50 Daily Options (daily expiry)",
};
const PRODUCT_ORDER = ["ODAX", "ODAP", "OESX", "OEXP"];

function populateProducts() {
  const available = new Set(Object.keys(typeof SNAPSHOT_DATA !== "undefined" ? SNAPSHOT_DATA : {}));
  if (available.size === 0) {
    emptyEl.style.display = "block";
    return;
  }
  const products = PRODUCT_ORDER.filter(p => available.has(p)).concat([...available].filter(p => !PRODUCT_ORDER.includes(p)));
  for (const p of products) {
    const opt = document.createElement("option");
    opt.value = p;
    opt.textContent = PRODUCT_LABELS[p] || p;
    productSelect.appendChild(opt);
  }
  productSelect.value = products[0];
  populateExpiries();
}

function populateExpiries() {
  const productCode = productSelect.value;
  const product = SNAPSHOT_DATA[productCode];
  const isDaily = DAILY_PRODUCTS.has(productCode);
  const latest = latestSession(product);
  expirySelect.innerHTML = "";
  for (const exp of latest.expiries) {
    const dte = daysBetween(latest.date, exp.expiry);
    // у ODAP/OEXP Eurex помечает и ежедневную, и обычную недельную цепочку одним и тем же
    // кодом "W" — здесь это всегда ежедневная экспирация, подписываем явно как "D"
    const typeLabel = isDaily && exp.contractType === "W" ? "D" : (exp.contractType || "?");
    const opt = document.createElement("option");
    opt.value = exp.expiry;
    opt.textContent = `${exp.expiry} (${typeLabel}, ${dte}d)`;
    expirySelect.appendChild(opt);
  }
  render();
}

function render() {
  if (activeTab === "oiVol") renderOiVol();
  else if (activeTab === "matrix") renderMatrix();
  else if (activeTab === "changeMatrix") renderChangeMatrix();
  else renderPcRatio();
}

const hoverColumnHighlight = {
  id: "hoverColumnHighlight",
  beforeDatasetsDraw(chart) {
    const active = chart.getActiveElements();
    if (!active.length) return;
    const index = active[0].index;
    const { ctx, chartArea, scales: { x } } = chart;
    const catWidth = (chartArea.right - chartArea.left) / chart.data.labels.length;
    const center = x.getPixelForValue(index);
    ctx.save();
    ctx.fillStyle = "rgba(148, 163, 184, 0.12)";
    ctx.fillRect(center - catWidth / 2, chartArea.top, catWidth, chartArea.bottom - chartArea.top);
    ctx.restore();
  }
};

function computeMaxPain(strikes) {
  // страйк экспирации, при котором суммарная выплата держателям call+put минимальна
  // (т.е. максимальная "боль" для держателей опционов — отсюда название)
  let bestStrike = strikes[0].strike, bestPayout = Infinity;
  for (const candidate of strikes) {
    const s = candidate.strike;
    let payout = 0;
    for (const row of strikes) {
      if (row.strike < s) payout += row.callOi * (s - row.strike); // call ITM
      else if (row.strike > s) payout += row.putOi * (row.strike - s); // put ITM
    }
    if (payout < bestPayout) { bestPayout = payout; bestStrike = s; }
  }
  return bestStrike;
}

function renderOiVol() {
  const product = SNAPSHOT_DATA[productSelect.value];
  const session = latestSession(product);
  const expiry = session.expiries.find(e => e.expiry === expirySelect.value);
  if (!expiry) return;

  const strikes = expiry.strikes;
  const labels = strikes.map(s => s.strike);
  const callOi = strikes.map(s => s.callOi);
  const putOi = strikes.map(s => s.putOi);
  const callVol = strikes.map(s => s.callVolume);
  const putVol = strikes.map(s => s.putVolume);

  const totalCallOi = callOi.reduce((a, b) => a + b, 0);
  const totalPutOi = putOi.reduce((a, b) => a + b, 0);
  const totalCallVol = callVol.reduce((a, b) => a + b, 0);
  const totalPutVol = putVol.reduce((a, b) => a + b, 0);
  const pcRatioOi = totalCallOi ? (totalPutOi / totalCallOi).toFixed(2) : "n/a";
  const pcRatioVol = totalCallVol ? (totalPutVol / totalCallVol).toFixed(2) : "n/a";
  const maxPainStrike = computeMaxPain(strikes);

  let nearestIdx = 0, nearestDiff = Infinity;
  strikes.forEach((s, i) => {
    const diff = Math.abs(s.strike - session.underlying);
    if (diff < nearestDiff) { nearestDiff = diff; nearestIdx = i; }
  });
  const maxPainIdx = labels.indexOf(maxPainStrike);

  summaryEl.innerHTML = `
    <div><div class="label">Session</div><div class="value">${session.date}</div></div>
    <div><div class="label">Future</div><div class="value">${fmt(session.underlying)}</div></div>
    <div><div class="label">Call OI</div><div class="value">${fmt(totalCallOi)}</div></div>
    <div><div class="label">Put OI</div><div class="value">${fmt(totalPutOi)}</div></div>
    <div><div class="label">P/C ratio (OI)</div><div class="value">${pcRatioOi}</div></div>
    <div><div class="label">P/C ratio (Volume)</div><div class="value">${pcRatioVol}</div></div>
    <div><div class="label">Max Pain</div><div class="value">${fmt(maxPainStrike)}</div></div>
  `;

  const annotation = {
    underlyingLine: {
      type: "line",
      scaleID: "x",
      value: nearestIdx, // на category-шкале getPixelForValue ждёт индекс категории, не само значение страйка
      borderColor: "#22d3ee",
      borderWidth: 2,
      borderDash: [6, 4],
      label: { display: true, content: `Future ${fmt(session.underlying)}`, position: "start", backgroundColor: "#22d3ee", color: "#0a0e14", font: { weight: "600" } }
    },
    maxPainLine: {
      type: "line",
      scaleID: "x",
      value: maxPainIdx,
      borderColor: "#a78bfa",
      borderWidth: 2,
      borderDash: [2, 3],
      label: { display: true, content: `Max Pain ${fmt(maxPainStrike)}`, position: "end", backgroundColor: "#a78bfa", color: "#0a0e14", font: { weight: "600" } }
    }
  };

  const zoom = {
    pan: { enabled: true, mode: "x" },
    zoom: { wheel: { enabled: true }, pinch: { enabled: true }, mode: "x" },
  };

  const chartBaseOptions = {
    responsive: true,
    interaction: { mode: "index", intersect: false, axis: "x" },
    scales: {
      x: { ticks: { autoSkip: true, maxTicksLimit: 30, color: "#7b8794" }, grid: { display: false }, border: { color: "#232b38" } },
      y: { ticks: { color: "#7b8794" }, grid: { color: "#1a212c" }, border: { display: false } }
    }
  };

  if (oiChart) oiChart.destroy();
  oiChart = new Chart(document.getElementById("oiChart"), {
    type: "bar",
    data: { labels, datasets: [
      { label: "Call OI", data: callOi, backgroundColor: "#3b82f6", borderRadius: 3, borderSkipped: false },
      { label: "Put OI", data: putOi, backgroundColor: "#f59e0b", borderRadius: 3, borderSkipped: false },
    ]},
    plugins: [hoverColumnHighlight],
    options: {
      ...chartBaseOptions,
      plugins: { title: { display: true, text: "Open Interest by Strike", color: "#e6edf3" }, legend: { labels: { color: "#7b8794" } }, annotation: { annotations: annotation }, zoom },
    }
  });

  if (volChart) volChart.destroy();
  volChart = new Chart(document.getElementById("volChart"), {
    type: "bar",
    data: { labels, datasets: [
      { label: "Call Volume", data: callVol, backgroundColor: "rgba(59,130,246,0.6)", borderRadius: 3, borderSkipped: false },
      { label: "Put Volume", data: putVol, backgroundColor: "rgba(245,158,11,0.6)", borderRadius: 3, borderSkipped: false },
    ]},
    plugins: [hoverColumnHighlight],
    options: {
      ...chartBaseOptions,
      plugins: { title: { display: true, text: "Volume by Strike", color: "#e6edf3" }, legend: { labels: { color: "#7b8794" } }, annotation: { annotations: annotation }, zoom },
    }
  });
}

const CALL_COLOR = [59, 130, 246]; // #3b82f6
const PUT_COLOR = [245, 158, 11]; // #f59e0b

function cellStyle(v, maxVal, color) {
  if (!v) return "";
  // корень вместо линейной шкалы — средне-высокие значения быстрее доходят до
  // насыщенного цвета, а не остаются тусклыми до тех пор, пока не приблизятся к максимуму
  const alpha = Math.min(1, 0.15 + 0.85 * Math.sqrt(v / maxVal));
  return ` style="background: rgba(${color[0]},${color[1]},${color[2]},${alpha.toFixed(2)})"`;
}

function collectColumns(product, targetExpiry) {
  // страйки и даты собираем по всем сессиям, где встречается выбранная экспирация
  const strikesSet = new Set();
  const columns = []; // { date, underlying, byStrike: Map }
  for (const session of product.sessions) {
    const exp = session.expiries.find(e => e.expiry === targetExpiry);
    if (!exp) continue;
    const byStrike = new Map(exp.strikes.map(s => [s.strike, s]));
    for (const k of byStrike.keys()) strikesSet.add(k);
    columns.push({ date: session.date, underlying: session.underlying, byStrike });
  }
  const strikes = [...strikesSet].sort((a, b) => a - b);
  return { strikes, columns };
}

function renderMatrix() {
  const product = SNAPSHOT_DATA[productSelect.value];
  const targetExpiry = expirySelect.value;
  const { strikes, columns } = collectColumns(product, targetExpiry);

  if (strikes.length === 0 || columns.length === 0) {
    matrixContainer.innerHTML = `<div class="empty">No accumulated history for this expiry — run save_snapshot.py --backfill.</div>`;
    return;
  }

  let maxCallOi = 1, maxPutOi = 1;
  for (const col of columns) for (const strike of strikes) {
    const row = col.byStrike.get(strike);
    if (!row) continue;
    if (row.callOi > maxCallOi) maxCallOi = row.callOi;
    if (row.putOi > maxPutOi) maxPutOi = row.putOi;
  }

  const lastCol = columns[columns.length - 1];
  let atmStrike = strikes[0], atmDiff = Infinity;
  for (const s of strikes) {
    const d = Math.abs(s - lastCol.underlying);
    if (d < atmDiff) { atmDiff = d; atmStrike = s; }
  }

  const displayColumns = [...columns].reverse(); // самая свежая дата — первая колонка

  let html = `<div class="wrap"><table class="heatmap"><thead>`;
  html += `<tr><th class="strike-col" rowspan="2">Strike</th>`;
  for (const col of displayColumns) html += `<th class="date-col" colspan="2">${col.date}</th>`;
  html += `</tr><tr>`;
  for (const col of displayColumns) html += `<th>Call OI</th><th>Put OI</th>`;
  html += `</tr></thead><tbody>`;
  for (const strike of strikes) {
    const rowClass = strike === atmStrike ? ' class="atm-row"' : "";
    html += `<tr${rowClass}><td class="strike-col">${strike}</td>`;
    for (const col of displayColumns) {
      const row = col.byStrike.get(strike);
      const callV = row ? row.callOi : 0;
      const putV = row ? row.putOi : 0;
      html += `<td class="call-cell"${cellStyle(callV, maxCallOi, CALL_COLOR)}>${callV || ""}</td>`;
      html += `<td class="put-cell"${cellStyle(putV, maxPutOi, PUT_COLOR)}>${putV || ""}</td>`;
    }
    html += `</tr>`;
  }
  html += `</tbody></table></div>`;
  matrixContainer.innerHTML = html;
}

function diffCellStyle(diff, maxAbsDiff) {
  if (!diff) return "";
  const color = diff > 0 ? CALL_COLOR : PUT_COLOR;
  const alpha = Math.min(1, 0.08 + 0.92 * (Math.abs(diff) / maxAbsDiff));
  return ` style="background: rgba(${color[0]},${color[1]},${color[2]},${alpha.toFixed(2)})"`;
}

function renderChangeMatrix() {
  const product = SNAPSHOT_DATA[productSelect.value];
  const targetExpiry = expirySelect.value;
  const { strikes, columns } = collectColumns(product, targetExpiry);

  if (columns.length < 2) {
    changeMatrixContainer.innerHTML = `<div class="empty">Need at least 2 sessions of history to compute OI change — run save_snapshot.py --backfill.</div>`;
    return;
  }

  // диапазон i=1..columns.length-1: изменение относительно предыдущей сохранённой сессии
  const diffCols = [];
  for (let i = 1; i < columns.length; i++) {
    diffCols.push({ date: columns[i].date, prev: columns[i - 1], cur: columns[i] });
  }

  let maxAbsCallDiff = 1, maxAbsPutDiff = 1;
  const diffsByCol = diffCols.map(({ prev, cur }) => {
    const byStrike = new Map();
    for (const strike of strikes) {
      const p = prev.byStrike.get(strike), c = cur.byStrike.get(strike);
      const callDiff = (c ? c.callOi : 0) - (p ? p.callOi : 0);
      const putDiff = (c ? c.putOi : 0) - (p ? p.putOi : 0);
      byStrike.set(strike, { callDiff, putDiff });
      if (Math.abs(callDiff) > maxAbsCallDiff) maxAbsCallDiff = Math.abs(callDiff);
      if (Math.abs(putDiff) > maxAbsPutDiff) maxAbsPutDiff = Math.abs(putDiff);
    }
    return byStrike;
  });

  const lastCol = columns[columns.length - 1];
  let atmStrike = strikes[0], atmDiff = Infinity;
  for (const s of strikes) {
    const d = Math.abs(s - lastCol.underlying);
    if (d < atmDiff) { atmDiff = d; atmStrike = s; }
  }

  const fmtDiff = v => v > 0 ? `+${v}` : `${v}`;

  // самая свежая пара дат — первая колонка
  const displayDiffCols = [...diffCols].reverse();
  const displayDiffsByCol = [...diffsByCol].reverse();

  let html = `<div class="wrap"><table class="heatmap"><thead>`;
  html += `<tr><th class="strike-col" rowspan="2">Strike</th>`;
  for (const { date, prev } of displayDiffCols) html += `<th class="date-col" colspan="2">${prev.date} → ${date}</th>`;
  html += `</tr><tr>`;
  for (const _ of displayDiffCols) html += `<th>Call OI Δ</th><th>Put OI Δ</th>`;
  html += `</tr></thead><tbody>`;
  for (const strike of strikes) {
    const rowClass = strike === atmStrike ? ' class="atm-row"' : "";
    html += `<tr${rowClass}><td class="strike-col">${strike}</td>`;
    for (const byStrike of displayDiffsByCol) {
      const { callDiff, putDiff } = byStrike.get(strike);
      html += `<td class="call-cell"${diffCellStyle(callDiff, maxAbsCallDiff)}>${callDiff ? fmtDiff(callDiff) : ""}</td>`;
      html += `<td class="put-cell"${diffCellStyle(putDiff, maxAbsPutDiff)}>${putDiff ? fmtDiff(putDiff) : ""}</td>`;
    }
    html += `</tr>`;
  }
  html += `</tbody></table></div>`;
  changeMatrixContainer.innerHTML = html;
}

function movingAverage(values, window) {
  return values.map((_, i) => {
    const slice = values.slice(Math.max(0, i - window + 1), i + 1).filter(v => v != null);
    return slice.length ? slice.reduce((a, b) => a + b, 0) / slice.length : null;
  });
}

function sumRatios(strikes) {
  let callOi = 0, putOi = 0, callVol = 0, putVol = 0;
  for (const s of strikes) { callOi += s.callOi; putOi += s.putOi; callVol += s.callVolume; putVol += s.putVolume; }
  return {
    pcOi: callOi ? putOi / callOi : null,
    pcVol: callVol ? putVol / callVol : null,
  };
}

const pcNeutralLine = {
  neutral: {
    type: "line", scaleID: "y", value: 1,
    borderColor: "#7b8794", borderWidth: 1, borderDash: [4, 4],
    label: { display: true, content: "Neutral (1.0)", position: "end", backgroundColor: "#7b8794", color: "#0a0e14", font: { size: 10, weight: "600" } }
  }
};

function renderPcRatio() {
  const product = SNAPSHOT_DATA[productSelect.value];
  const targetExpiry = expirySelect.value;
  const chartBaseOptions = {
    responsive: true,
    interaction: { mode: "index", intersect: false, axis: "x" },
    scales: {
      x: { ticks: { autoSkip: true, maxTicksLimit: 30, color: "#7b8794" }, grid: { display: false }, border: { color: "#232b38" } },
      y: { ticks: { color: "#7b8794" }, grid: { color: "#1a212c" }, border: { display: false } }
    }
  };

  // --- график 1: динамика P/C ratio по датам для выбранной экспирации (бары + тренд) ---
  const historyPoints = [];
  for (const session of product.sessions) {
    const exp = session.expiries.find(e => e.expiry === targetExpiry);
    if (!exp) continue;
    const { pcOi, pcVol } = sumRatios(exp.strikes);
    historyPoints.push({ date: session.date, pcOi, pcVol });
  }

  const metric = pcMetricSelect.value; // "oi" | "vol"
  const values = historyPoints.map(p => metric === "oi" ? p.pcOi : p.pcVol);
  const trend = movingAverage(values, 3);
  const validValues = values.filter(v => v != null);
  const current = validValues.length ? validValues[validValues.length - 1] : null;
  const average = validValues.length ? validValues.reduce((a, b) => a + b, 0) / validValues.length : null;

  const currentEl = document.getElementById("pcCurrentVal");
  currentEl.textContent = current != null ? current.toFixed(2) : "n/a";
  currentEl.style.color = current == null ? "" : current < 1 ? "#60a5fa" : "#f87171";
  document.getElementById("pcAvgVal").textContent = average != null ? average.toFixed(2) : "n/a";
  document.getElementById("pcHistoryTitle").textContent = `Put/Call Ratio by Day — ${targetExpiry} · ${metric === "oi" ? "Open Interest" : "Volume"}`;

  if (pcHistoryChart) pcHistoryChart.destroy();
  pcHistoryChart = new Chart(document.getElementById("pcHistoryChart"), {
    data: {
      labels: historyPoints.map(p => p.date),
      datasets: [
        { type: "bar", label: `P/C ratio (${metric === "oi" ? "OI" : "Volume"})`, data: values, backgroundColor: values.map(v => v == null ? "#7b8794" : v < 1 ? "#3b82f6" : "#f59e0b"), borderRadius: 4, borderSkipped: false, order: 2 },
        { type: "line", label: "Trend (3-session avg)", data: trend, borderColor: "#e6edf3", borderWidth: 2, tension: 0.35, pointRadius: 0, fill: false, order: 1 },
      ]
    },
    options: {
      ...chartBaseOptions,
      plugins: {
        legend: { labels: { color: "#7b8794" } },
        annotation: { annotations: pcNeutralLine }
      }
    }
  });

  // --- график 2: P/C ratio по всем экспирациям текущей сессии (term structure) ---
  const session = latestSession(product);
  const termPoints = session.expiries.map(exp => ({
    label: `${exp.expiry} (${daysBetween(session.date, exp.expiry)}d)`,
    ...sumRatios(exp.strikes)
  }));

  if (pcTermChart) pcTermChart.destroy();
  pcTermChart = new Chart(document.getElementById("pcTermChart"), {
    type: "bar",
    data: {
      labels: termPoints.map(p => p.label),
      datasets: [
        { label: "P/C ratio (OI)", data: termPoints.map(p => p.pcOi), backgroundColor: "#22d3ee", borderRadius: 3, borderSkipped: false },
        { label: "P/C ratio (Volume)", data: termPoints.map(p => p.pcVol), backgroundColor: "#a78bfa", borderRadius: 3, borderSkipped: false },
      ]
    },
    options: {
      ...chartBaseOptions,
      plugins: {
        title: { display: true, text: `P/C Ratio by Expiry — session ${session.date}`, color: "#e6edf3" },
        legend: { labels: { color: "#7b8794" } },
        annotation: { annotations: pcNeutralLine }
      }
    }
  });
}

document.getElementById("tabOiVolBtn").addEventListener("click", () => switchTab("oiVol"));
document.getElementById("tabMatrixBtn").addEventListener("click", () => switchTab("matrix"));
document.getElementById("tabChangeMatrixBtn").addEventListener("click", () => switchTab("changeMatrix"));
document.getElementById("tabPcRatioBtn").addEventListener("click", () => switchTab("pcRatio"));
pcMetricSelect.addEventListener("change", () => { if (activeTab === "pcRatio") renderPcRatio(); });
document.getElementById("resetZoomBtn").addEventListener("click", () => {
  if (oiChart) oiChart.resetZoom();
  if (volChart) volChart.resetZoom();
});
productSelect.addEventListener("change", populateExpiries);
expirySelect.addEventListener("change", render);
populateProducts();
</script>
